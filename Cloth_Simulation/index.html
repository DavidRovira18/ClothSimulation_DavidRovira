<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Interactive 3D Cloth Simulation</title>

    <script type="importmap">
        {
            "imports": {
                "three": "../node_modules/three/build/three.module.js",
                "three/addons/": "../node_modules/three/examples/jsm/"
            }
        }
    </script>
</head>
<style>
    body{
        margin:0;
    }

    canvas {
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0; /* Ensure canvas is behind the text */
    }

    .visible, .hidden {
        position: absolute;
        top: 10px; /* Adjust as needed */
        left: 10px; /* Adjust as needed */
        z-index: 100; /* Ensure text is on top */
        color: green;
        font-size: 24px;
        font-weight: bold;
    }

    .toggle_simulation{
        position: absolute;
        top: 10px;
        left: 20%;
        z-index: 100;
    }

    .hidden {
        display: none;
    }
</style>
<body>

    <h class="visible" id="paused">Simulation Paused!</h>
    <h class="hidden" id="running">Simulation Running!</h>
    <button class="toggle_simulation">Play Simulation</button>
    <script type="module" src="constraints.js"></script>
    <script type="module" src="integrators.js"></script>
    <script type="module" src="collisions.js"></script>
    <script type="module" src="RigidBody.js"></script>
    <script type="module" src="ParticleSystem.js"></script>
    <script type="module" src="cloth.js"></script>
</body>
</html>
